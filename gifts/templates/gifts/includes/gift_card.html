<li class="list-group-item d-flex justify-content-between align-items-center">
    <div>
        <a href="{% url 'gifts:detail' gift.id %}">
            <strong>{{ gift.idea }}</strong>
        </a>
        <br>
        <small class="text-muted">
            Кому: {{ gift.person.name }} | Событие: {{ gift.event.title }}
        </small>
    </div>
    {% if gift.status == "given" %}
        <span class="badge bg-success">Вручён</span>
    {% elif gift.status == "cancelled" %}
        <span class="badge bg-secondary">Отменён</span>
    {% else %}
        <span class="badge bg-warning text-dark">Запланирован</span>
    {% endif %}
</li>
