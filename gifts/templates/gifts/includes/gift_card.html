<li class="list-group-item d-flex justify-content-between align-items-center">
    <div>
        <a href="{% url 'gifts:detail' gift.id %}">
            <strong>{{ gift.idea }}</strong>
        </a>
        <br>
        <small class="text-muted">
            Кому: {{ gift.person.name }} | Событие: {{ gift.event.title }}
        </small>
    </div>
    {% if gift.is_done %}
        <span class="badge bg-success">Вручён</span>
    {% else %}
        <span class="badge bg-warning text-dark">Не вручён</span>
    {% endif %}
</li>
