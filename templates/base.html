{% load static %}
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Gift Planner{% endblock %}</title>
    <link rel="icon" type="image/png" href="{% static 'homepage/img/logo.png' %}">
    <!-- Bootstrap -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <!-- Собственный CSS -->
    <link rel="stylesheet" href="{% static 'homepage/css/style.css' %}">
</head>
<body>
    <!-- Навигация (вынесена в include) -->
    {% include "includes/navigation.html" %}

    <main class="container mt-4">
        {% block content %}
        {% endblock %}
    </main>

    <!-- Подвал с JavaScript -->
    <footer class="container mt-5 mb-3 text-center text-muted">
        <p>© <span id="current-year"></span> Gift Planner</p>
    </footer>

    <!-- Собственный JavaScript -->
    <script src="{% static 'homepage/js/main.js' %}"></script>
</body>
</html>
